<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Sản Phẩm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        table {
            width: 100%;
            max-width: 600px;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 10px;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <!-- Tiêu đề h1 đúng yêu cầu -->
    <h1>Danh sách sản phẩm</h1>

    <!-- Bảng hiển thị danh sách sản phẩm -->
    <table>
        <thead>
            <tr>
                <th>Tên sản phẩm</th>
                <th>Giá</th>
                <th>Số lượng</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Điện thoại iPhone 15 Pro</td>
                <td>28.990.000 VNĐ</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Laptop Dell XPS 13</td>
                <td>35.500.000 VNĐ</td>
                <td>5</td>
            </tr>
            <tr>
                <td>Tai nghe Sony WH-1000XM5</td>
                <td>6.490.000 VNĐ</td>
                <td>15</td>
            </tr>
            <tr>
                <td>Đồng hồ Apple Watch Series 9</td>
                <td>10.290.000 VNĐ</td>
                <td>8</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
